<!DOCTYPE html>
    <head>
        <title>Flash Card-1</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="image/favicon.png">
        <link href="./css/main.css" rel="stylesheet" type="text/css"/>
        <link href="./css/responsive.css" rel="stylesheet" type="text/css"/>
        <link href="./css/dropdownmenu.css" rel="stylesheet" type="text/css"/>
        <script src="./js/jquery.min.js"></script>
        <script src="./js/jquery-3.7.1.min.js"></script>
        <script src="./js/flash-card1.js"></script>
    </head>
    <body>
        <div id="includeHtml"></div>
        <div id="repousse2">
            <div id="activityTitle">Flash Card - 1</div>
            <div id="controlArea">
                <div class="cardOrderSelect">
                    <!-- <span>**最初に表示するカード:**</span><br> -->
                    <input type="radio" id="radioCard1" name="firstCardSelect" value="card1" checked>
                    <label for="radioCard1">Show Burmese</label>
                    <input type="radio" id="radioCard2" name="firstCardSelect" value="card2">
                    <label for="radioCard2">Show English </label>
                </div>

                <div class="displayOrderSelect">
                    <span>**Display Order:**</span><br>
                    <input type="radio" id="randomCard" name="displayOrder" value="random">
                    <label for="randomCard">Show Random</label>
                    <input type="radio" id="noRandomCard" name="displayOrder" value="noRandom" checked>
                    <label for="noRandomCard">Not Random</label>
                </div>
            </div>
            <div id="cardArea"></div>
            <div id="buttonArea"></div>
         </div>
         <script>
            $(function() {
               $.get('menubar.html', appndHtml);
               function appndHtml(data) {
                  $("#includeHtml").prepend(data);
               }
            });
         </script>
    </body>
</html>
